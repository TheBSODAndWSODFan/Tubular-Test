name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        type: string
        description: 'Title'
        required: true
        default: 'v0.00.0 R0'
      is_pre_release:
        type: boolean
        description: 'Set as a pre-release'
        required: true
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions: write-all

    steps:
      - name: Checkout branch "${{ github.ref_name }}"
        run: |
          git clone --no-checkout https://github.com/polymorphicshade/Tubular.git .
          git config core.symlinks false
          git checkout --progress --force ${{ github.ref_name }}
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: 'gradle'

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo ${{secrets.KEYSTORE}} | sed 's/./& /g'
          echo ${{secrets.SIGNING_STORE_PASSWORD}} | sed 's/./& /g'
